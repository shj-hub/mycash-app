<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>家計簿</title>

<style>

body{

    font-family:Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;

}

.container{

    max-width:420px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);

}

h1{

    text-align:center;

}

label{

    display:block;
    margin-top:18px;
    margin-bottom:5px;
    font-weight:bold;

}

input,select{

    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid #cccccc;
    border-radius:6px;
    box-sizing:border-box;

}

button{

    width:100%;
    margin-top:30px;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#0078D7;
    color:white;
    cursor:pointer;

}

button:hover{

    background:#005ea8;

}

#message{

    margin-top:20px;
    text-align:center;
    color:green;

}

</style>

</head>

<body>

<div class="container">

<h1>家計簿入力</h1>

<label>日付</label>

<input type="date" id="date">

<label>財源</label>

<select id="category1">

<option></option>
<option>個人</option>
<option>家計</option>

</select>

<label>分類</label>

<select id="category2">

<option>食費</option>
<option>趣味</option>
<option>交通費</option>
<option>ガソリン</option>
<option>医療費</option>
<option>ボディメンテ</option>
<option>その他</option>
</select>

<label>金額</label>

<input type="number" id="price">

<label>支払方法</label>

<select id="payment">

<option>現金</option>
<option>クレジット</option>
<option>電子マネー</option>

</select>

<label>メモ</label>

<input type="text" id="memo">

<button>

登録

</button>

<div id="message">

Ver1.0

</div>

</div>

</body>

</html>
