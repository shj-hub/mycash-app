<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<style>

body{

font-family:sans-serif;

padding:20px;

}

input,select{

width:100%;

padding:12px;

margin-bottom:15px;

font-size:18px;

}

button{

width:100%;

padding:15px;

font-size:20px;

}

</style>

</head>

<body>

<h2>家計簿入力</h2>

<input
type="date"
id="date">

<select id="source">

<option>個人</option>
<option>家計</option>

</select>

<select id="category">

<option>食費</option>
<option>交通費</option>
<option>娯楽</option>
<option>書籍</option>
<option>医療費</option>
<option>ボディメンテ</option>

</select>

<select id="method">

<option>クレジット</option>
<option>現金</option>
<option>電子マネー</option>

</select>
<input
type="number"
id="amount"
placeholder="金額">

<input
id="memo"
placeholder="メモ">

<button onclick="save()">

保存

</button>

<script>

document.getElementById("date").valueAsDate=new Date();

function save(){

const data={

date:document.getElementById("source").value,

shop:document.getElementById("category").value,

category:document.getElementById("method").value,

amount:document.getElementById("amount").value,

memo:document.getElementById("memo").value

};

google.script.run
.withSuccessHandler(function(){

alert("保存しました");

document.getElementById("amount").value="";
document.getElementById("memo").value="";

})
.saveData(data);

}

</script>

</body>

</html>
